[package]
name = "nerve-waf-plugin-host"
description = "Plugin host: scan plugins/, load JSON/Lua/Rust plugins, hot reload"
version.workspace = true
edition.workspace = true

[dependencies]
nerve-waf-sdk = { workspace = true }
nerve-waf-l7 = { workspace = true }
nerve-waf-plugins = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
regex = "1"
glob = "0.3"
mlua = { version = "0.10", features = ["lua54", "vendored"] }
thiserror = { workspace = true }
tracing = { workspace = true }
