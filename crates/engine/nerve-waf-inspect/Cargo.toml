[package]
name = "nerve-waf-inspect"
description = "Unified inspect pipeline (pre_access to expert to core to custom)"
version.workspace = true
edition.workspace = true

[features]
default = []
# First-party expert engine (requires sibling Nerve-antibody repo).
expert = ["dep:nerve-antibody"]
inspect-trace = ["dep:nerve-inspect-trace"]
accel-hyperscan = ["expert", "nerve-antibody/accel-hyperscan"]
accel-hyperscan-ffi = ["expert", "nerve-antibody/accel-hyperscan-ffi"]

[dependencies]
nerve-waf-core = { workspace = true }
nerve-waf-sdk = { workspace = true }
nerve-waf-l7 = { workspace = true }
nerve-waf-plugin-host = { workspace = true }
nerve-waf-cc = { workspace = true }
nerve-waf-geo = { workspace = true }
nerve-waf-bot = { workspace = true }
nerve-waf-intel = { workspace = true }
nerve-waf-api-sec = { workspace = true }
nerve-waf-whitelist = { workspace = true }
nerve-waf-behavior = { workspace = true }
nerve-waf-libinjection = { workspace = true }
nerve-waf-semantic = { workspace = true }
nerve-waf-coraza = { workspace = true }
nerve-waf-wasm = { workspace = true }
nerve-antibody = { git = "https://github.com/ahaiii/antibody", branch = "main", optional = true }
nerve-inspect-trace = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
