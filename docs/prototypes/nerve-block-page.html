<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>请求已被拦截 · Nerve</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #07111f;
      --ink-2: #243247;
      --mute: #5c6b82;
      --line: rgba(7, 17, 31, 0.09);
      --teal: #0a6b5c;
      --teal-2: #0d8a75;
      --amber: #9a6700;
      --surface: rgba(255, 255, 255, 0.78);
      --surface-2: rgba(255, 255, 255, 0.55);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      overflow: hidden;
    }
    body {
      font-family: "Instrument Sans", "Segoe UI", sans-serif;
      color: var(--ink);
      background-color: #dfe7f1;
      background-image:
        radial-gradient(ellipse 900px 520px at 50% -8%, rgba(13, 138, 117, 0.16), transparent 58%),
        radial-gradient(ellipse 700px 480px at 100% 100%, rgba(36, 64, 110, 0.1), transparent 55%),
        linear-gradient(180deg, #e8eef6 0%, #dce5f0 100%);
      display: grid;
      place-items: center;
      padding: 16px;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(7, 17, 31, 0.028) 1px, transparent 1px),
        linear-gradient(90deg, rgba(7, 17, 31, 0.028) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, #000 20%, transparent 75%);
      pointer-events: none;
    }

    .stage {
      position: relative;
      z-index: 1;
      width: min(480px, 100%);
      max-height: calc(100vh - 32px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      animation: enter 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes enter {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: none; }
    }

    .brand {
      text-align: center;
      margin-bottom: 18px;
      flex-shrink: 0;
    }
    .logo {
      width: 40px;
      height: 40px;
      margin: 0 auto 10px;
      border-radius: 11px;
      background: linear-gradient(145deg, #12a38c 0%, #075447 100%);
      display: grid;
      place-items: center;
      box-shadow:
        0 1px 0 rgba(255,255,255,0.25) inset,
        0 10px 28px rgba(10, 107, 92, 0.25);
      position: relative;
    }
    .logo svg { width: 20px; height: 20px; color: #fff; }
    .logo::after {
      content: "";
      position: absolute;
      inset: -5px;
      border-radius: 15px;
      border: 1px solid rgba(10, 107, 92, 0.2);
      animation: ring 3.2s ease-in-out infinite;
    }
    @keyframes ring {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(1.05); opacity: 0.12; }
    }

    .brand h1 {
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: -0.045em;
      line-height: 1;
    }
    .brand p {
      margin-top: 5px;
      font-size: 0.65rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--mute);
    }

    .card {
      background: var(--surface);
      backdrop-filter: blur(18px) saturate(1.15);
      -webkit-backdrop-filter: blur(18px) saturate(1.15);
      border: 1px solid rgba(255, 255, 255, 0.65);
      border-radius: 18px;
      padding: 22px 22px 18px;
      box-shadow:
        0 1px 0 rgba(255,255,255,0.9) inset,
        0 20px 48px rgba(7, 17, 31, 0.08);
      flex-shrink: 1;
      min-height: 0;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--amber);
      background: rgba(154, 103, 0, 0.08);
      border: 1px solid rgba(154, 103, 0, 0.16);
      padding: 5px 10px 5px 8px;
      border-radius: 999px;
    }
    .pill i {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--amber);
      box-shadow: 0 0 0 3px rgba(154, 103, 0, 0.18);
      animation: alive 1.8s ease-in-out infinite;
    }
    @keyframes alive {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.45; }
    }
    .code-http {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 0.68rem;
      font-weight: 500;
      color: var(--mute);
    }

    .headline {
      font-size: 1.28rem;
      font-weight: 700;
      letter-spacing: -0.035em;
      line-height: 1.25;
      margin-bottom: 8px;
    }
    .desc {
      font-size: 0.86rem;
      line-height: 1.5;
      color: var(--ink-2);
      margin-bottom: 16px;
    }

    .facts {
      display: grid;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: var(--surface-2);
      margin-bottom: 14px;
    }
    .fact {
      display: grid;
      grid-template-columns: 72px 1fr auto;
      gap: 8px;
      padding: 9px 12px;
      align-items: center;
      border-bottom: 1px solid var(--line);
    }
    .fact:last-child { border-bottom: none; }
    .fact dt {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 0.62rem;
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--mute);
    }
    .fact dd {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 0.76rem;
      font-weight: 500;
      color: var(--ink);
      word-break: break-all;
      min-width: 0;
    }

    .btn-copy {
      appearance: none;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.7);
      color: var(--ink-2);
      font-family: inherit;
      font-size: 0.68rem;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .btn-copy:hover {
      background: #fff;
      border-color: rgba(7, 17, 31, 0.16);
    }
    .btn-copy.is-done {
      color: var(--teal);
      border-color: rgba(10, 107, 92, 0.28);
      background: rgba(10, 107, 92, 0.06);
    }

    .secure-line {
      margin-top: 14px;
      text-align: center;
      font-size: 0.62rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(92, 107, 130, 0.7);
      flex-shrink: 0;
    }

    @media (max-height: 640px) {
      .brand { margin-bottom: 12px; }
      .logo { width: 34px; height: 34px; margin-bottom: 8px; }
      .brand h1 { font-size: 1.35rem; }
      .card { padding: 16px; }
      .headline { font-size: 1.12rem; }
      .desc { font-size: 0.8rem; margin-bottom: 12px; }
      .fact { padding: 7px 10px; }
    }
  </style>
</head>
<body>
  <div class="stage">
    <header class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3l8 3.5v5.2c0 4.6-3.2 7.8-8 9.3-4.8-1.5-8-4.7-8-9.3V6.5L12 3z" />
          <path d="M9.2 12.2l1.9 1.9 4.2-4.4" />
        </svg>
      </div>
      <h1>Nerve</h1>
      <p>Web Application Firewall</p>
    </header>

    <section class="card" role="alert">
      <div class="eyebrow">
        <span class="pill"><i></i> 请求已拦截</span>
        <span class="code-http">HTTP 403</span>
      </div>

      <h2 class="headline">此请求未通过安全检测</h2>
      <p class="desc">
        保护策略判定本次访问存在风险，已阻止继续访问。
        若为正常业务，请向站点管理员提供事件 ID 以便核查。
      </p>

      <dl class="facts">
        <div class="fact">
          <dt>事件 ID</dt>
          <dd id="event">nrv_7f3a2c91e04b</dd>
          <button type="button" class="btn-copy" id="copy" title="复制事件 ID">复制</button>
        </div>
        <div class="fact">
          <dt>Action</dt>
          <dd id="action">block</dd>
          <span></span>
        </div>
        <div class="fact">
          <dt>Rule</dt>
          <dd id="rule">sqli-union-select</dd>
          <span></span>
        </div>
        <div class="fact">
          <dt>Site</dt>
          <dd id="site">app-ms4in76m</dd>
          <span></span>
        </div>
      </dl>
    </section>

    <p class="secure-line">Protected by Nerve</p>
  </div>

  <script>
    const q = new URLSearchParams(location.search);
    const map = { event: "event", ref: "event", rule: "rule", site: "site", action: "action" };
    Object.keys(map).forEach((k) => {
      if (q.get(k)) document.getElementById(map[k]).textContent = q.get(k);
    });
    const copyBtn = document.getElementById("copy");
    copyBtn.addEventListener("click", async () => {
      const v = document.getElementById("event").textContent;
      try {
        await navigator.clipboard.writeText(v);
        copyBtn.textContent = "已复制";
        copyBtn.classList.add("is-done");
        setTimeout(() => {
          copyBtn.textContent = "复制";
          copyBtn.classList.remove("is-done");
        }, 1600);
      } catch (_) {}
    });
  </script>
</body>
</html>
