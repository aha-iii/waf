# 官方站静态资源 + WAF Console 反代（/console/、/assets/、/api/ → nerve-waf-console）
#
# 官网根路径 / ；Console 登录页 /console/（独立进程 8782；SPA /assets/ 与 /api/ 同域反代）

server {
    listen 9887;
    server_name _;

    root /usr/share/nginx/official;
    index index.html;

    client_max_body_size 32m;

    location = /console {
        return 301 /console/;
    }

    location /console/ {
        proxy_pass http://nerve-waf-console:8782/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /assets/ {
        proxy_pass http://nerve-waf-console:8782/assets/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
    }

    location /api/ {
        proxy_pass http://nerve-waf-console:8782/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
