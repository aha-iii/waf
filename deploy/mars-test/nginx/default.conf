# IIS/ARR 会在请求里注入 X-Original-URL，触发 WAF transfer-encoding-smuggle 误报。
# OpenResty 内置 headers-more，转发到 Edge 前完整删除这些头（设空字符串仍会命中 contains 规则）。

server {
    listen 9888;
    server_name _;

    client_max_body_size 100m;

    location / {
        more_clear_input_headers 'X-Original-URL' 'X-Rewrite-URL';

        proxy_pass http://nerve-waf-edge:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # 保留 IIS/上游已带的客户端 IP，供 WAF 攻击日志 src_ip 使用
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
