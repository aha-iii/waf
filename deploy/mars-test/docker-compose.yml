# test-mars 联调：API 9999 · Console 8782 · 官网 9887 · Nginx 剥 ARR 头 9888 → Edge
#
#   docker load -i ../../dist/nerve-waf-api-1.0.0.tar
#   cp .env.example .env   # 按需改 DATABASE_URL
#   # 需先有 ./target/{nerve-waf-api,nerve-waf-console,nerve-waf-edge,baseline,console,official}（deploy-runtime-to-test.sh）
#   docker compose up -d
# IIS 反代改为：http://<WAF主机IP>:9998/{R:0}
# 仅本地 dist 联调可另加：-f docker-compose.dev.yml（挂 ../../dist/runtime）

name: nerve-waf-mars-test

services:
  nerve-waf-api:
    image: nerve/nerve-waf-api:${TAG:-1.0.0}
    pull_policy: never
    container_name: nerve-waf-api
    ports:
      - "${PORT:-9999}:8781"
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      PORT: "8781"
      WAF_CONFIG: /etc/nerve-waf/config.yml
      WAF_CONSOLE_ATTACH: "0"
      NERVE_WAF_DATA: /var/lib/nerve-waf/data
      NERVE_RULES_DIR: /opt/nerve-waf/data/rules/crs
      DATABASE_URL: ${DATABASE_URL}
      NERVE_AUTH_ENABLED: "1"
      NERVE_AUTH_MODE: "local"
      NERVE_API_KEY: ${NERVE_API_KEY:-}
      KEYCLOAK_ENABLED: "0"
      KEYCLOAK_AUTH_SERVER_URL: ""
      KEYCLOAK_REALM: ""
      KEYCLOAK_CLIENT_ID: ""
      NERVE_EXPERT_ENGINE: ${NERVE_EXPERT_ENGINE:-on}
      NERVE_EXPERT_PACK: ${NERVE_EXPERT_PACK:-/opt/nerve/native/baseline}
      NERVE_NATIVE_DEV_PACK: ${NERVE_NATIVE_DEV_PACK:-1}
      NERVE_URL: ${NERVE_URL:-}
      NERVE_GATEWAY_ADMIN_URL: ${NERVE_GATEWAY_ADMIN_URL:-}
      NERVE_GATEWAY_DASHBOARD_URL: ${NERVE_GATEWAY_DASHBOARD_URL:-}
      NERVE_ALERT_URL: ${NERVE_ALERT_URL:-http://nerve-alert:8790}
      NERVE_ALERT_ENABLED: ${NERVE_ALERT_ENABLED:-1}
      NERVE_ENGRAM_URL: ${NERVE_ENGRAM_URL:-http://nerve-engram:8795}
      NERVE_LLM_ENABLED: ${NERVE_LLM_ENABLED:-0}
      NERVE_LLM_AUTO_EXPLAIN: ${NERVE_LLM_AUTO_EXPLAIN:-1}
      NERVE_LLM_API_URL: ${NERVE_LLM_API_URL:-}
      NERVE_LLM_API_KEY: ${NERVE_LLM_API_KEY:-}
      NERVE_LLM_MODEL: ${NERVE_LLM_MODEL:-}
      RUST_LOG: ${RUST_LOG:-info}
      WAF_ENABLE_LEGACY_TOPOLOGY: "0"
      WAF_ENABLE_LEGACY_NP: "0"
    volumes:
      # 与 DEPLOY_DIR 同级扁平布局：./config/config.yml（勿用 ../config，远端会指到 /aha/nerve/config）
      - ./config/config.yml:/etc/nerve-waf/config.yml:ro
      # deploy-runtime-to-test.sh 上传到 ./target/，热替换镜像内二进制与 baseline
      - ./target/nerve-waf-api:/usr/local/bin/nerve-waf-api:ro
      - ./target/nerve-waf-edge:/usr/local/bin/nerve-waf-edge:ro
      - ./target/baseline:/opt/nerve/native/baseline:ro
      - ./target/vendor/coreruleset:/opt/nerve-waf/vendor/coreruleset:ro
      - nerve-waf-data:/var/lib/nerve-waf/data
      - nerve-waf-logs:/var/lib/nerve-waf/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      nerve-alert:
        condition: service_healthy
      nerve-engram:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8781/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  nerve-waf-console:
    image: nerve/nerve-waf-api:${TAG:-1.0.0}
    pull_policy: never
    container_name: nerve-waf-console
    ports:
      - "${CONSOLE_PORT:-8782}:8782"
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      WAF_CONSOLE_PORT: "8782"
      WAF_API_UPSTREAM: http://nerve-waf-api:8781
      WAF_CONSOLE_DIR: /opt/nerve-waf/console
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - ./target/nerve-waf-console:/usr/local/bin/nerve-waf-console:ro
      - ./target/console:/opt/nerve-waf/console:ro
    depends_on:
      nerve-waf-api:
        condition: service_healthy
    entrypoint: ["/usr/local/bin/nerve-waf-console"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8782/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  nerve-waf-edge:
    image: nerve/nerve-waf-api:${TAG:-1.0.0}
    pull_policy: never
    container_name: nerve-waf-edge
    ports:
      - "${EDGE_PORT:-9889}:8080"
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      WAF_EDGE_PORT: "8080"
      WAF_EDGE_API: http://nerve-waf-api:8781
      NERVE_WAF_PLUGINS_DIR: /opt/nerve-waf/plugins
      NERVE_EXPERT_ENGINE: ${NERVE_EXPERT_ENGINE:-on}
      NERVE_EXPERT_PACK: ${NERVE_EXPERT_PACK:-/opt/nerve/native/baseline}
      NERVE_NATIVE_DEV_PACK: ${NERVE_NATIVE_DEV_PACK:-1}
      NERVE_NATIVE_EDGE_INLINE: ${NERVE_NATIVE_EDGE_INLINE:-1}
      NERVE_NATIVE_MAX_INSPECT_MS: ${NERVE_NATIVE_MAX_INSPECT_MS:-300}
      NERVE_NATIVE_SHADOW_DEEP: ${NERVE_NATIVE_SHADOW_DEEP:-1}
      NERVE_EDGE_REUSEPORT: ${NERVE_EDGE_REUSEPORT:-1}
      NERVE_EDGE_WORKERS: ${NERVE_EDGE_WORKERS:-auto}
      NERVE_EDGE_TIMING_ALL: ${NERVE_EDGE_TIMING_ALL:-0}
      NERVE_INSPECT_TRACE: ${NERVE_INSPECT_TRACE:-1}
      NERVE_INSPECT_TRACE_LOG: ${NERVE_INSPECT_TRACE_LOG:-1}
      NERVE_INSPECT_TRACE_MIN_US: ${NERVE_INSPECT_TRACE_MIN_US:-0}
      NERVE_ENGRAM_URL: ${NERVE_ENGRAM_URL:-http://nerve-engram:8795}
      RUST_LOG: ${RUST_LOG:-info,inspect_trace=info}
    volumes:
      - ./target/nerve-waf-api:/usr/local/bin/nerve-waf-api:ro
      - ./target/nerve-waf-edge:/usr/local/bin/nerve-waf-edge:ro
      - ./target/baseline:/opt/nerve/native/baseline:ro
      - ./scripts/run-edge-workers.sh:/opt/nerve/scripts/run-edge-workers.sh:ro
    depends_on:
      nerve-waf-api:
        condition: service_healthy
      nerve-alert:
        condition: service_healthy
    entrypoint: ["/opt/nerve/scripts/run-edge-workers.sh"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  nerve-alert:
    image: nerve/nerve-waf-api:${TAG:-1.0.0}
    pull_policy: never
    container_name: nerve-alert
    ports:
      - "${ALERT_PORT:-8790}:8790"
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      PORT: "8790"
      NERVE_ALERT_DATA: /var/lib/nerve-alert/data
      DATABASE_URL: ${DATABASE_URL}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - ./target/nerve-alert-api:/usr/local/bin/nerve-alert-api:ro
      - nerve-alert-data:/var/lib/nerve-alert/data
    entrypoint: ["/usr/local/bin/nerve-alert-api"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8790/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    restart: unless-stopped

  nerve-engram:
    image: node:20-bookworm-slim
    pull_policy: if_not_present
    container_name: nerve-engram
    working_dir: /opt/engram
    command:
      - node
      - gateway-dist/src/server.js
    ports:
      - "${ENGRAM_PORT:-8795}:8795"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      ENGRAM_PORT: "8795"
      ENGRAM_BIND: "0.0.0.0"
      ENGRAM_MODEL_ID: ${ENGRAM_MODEL_ID:-engram-waf-v1}
      ENGRAM_ARTIFACT_PATH: /opt/engram/artifact/engram-linear-v1.json
    volumes:
      - ./target/engram:/opt/engram:ro
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8795/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  nginx-waf-front:
    image: openresty/openresty:1.25.3.2-0-alpine
    pull_policy: if_not_present
    container_name: nginx-waf-front
    ports:
      - "${NGINX_PORT:-9888}:9888"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      nerve-waf-edge:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9888/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  nginx-official:
    image: nginx:1.27-alpine
    pull_policy: if_not_present
    container_name: nginx-official
    ports:
      - "${OFFICIAL_PORT:-9887}:9887"
    volumes:
      - ./nginx/official.conf:/etc/nginx/conf.d/default.conf:ro
      - ./target/official:/usr/share/nginx/official:ro
    depends_on:
      nerve-waf-api:
        condition: service_healthy
      nerve-waf-console:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9887/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  nerve-waf-data:
  nerve-waf-logs:
  nerve-alert-data:
