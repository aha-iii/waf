# 开发/联调：挂载 dist/runtime/（pack-dist-runtime 打包产物），拷贝到测试机即可。
#
# 开发机打包：
#   bash scripts/pack-dist-runtime.sh --build
#   或 powershell -File scripts/pack-dist-runtime.ps1 -Build
#
# 测试机（需已有 dist/runtime/ + nerve-waf-api-*.tar）：
#   docker load -i ../../dist/nerve-waf-api-1.0.0.tar
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# 更新版本：覆盖 dist/runtime/ 后 restart nerve-waf-api nerve-waf-edge

name: nerve-waf-mars-test

services:
  nerve-waf-api:
    volumes:
      - ${NERVE_WAF_API_BIN:-../../dist/runtime/nerve-waf-api}:/usr/local/bin/nerve-waf-api:ro
      - ${NERVE_WAF_EDGE_BIN:-../../dist/runtime/nerve-waf-edge}:/usr/local/bin/nerve-waf-edge:ro
      - ${NERVE_EXPERT_PACK_HOST:-../../dist/runtime/baseline}:/opt/nerve/native/baseline:ro

  nerve-waf-edge:
    volumes:
      - ${NERVE_WAF_API_BIN:-../../dist/runtime/nerve-waf-api}:/usr/local/bin/nerve-waf-api:ro
      - ${NERVE_WAF_EDGE_BIN:-../../dist/runtime/nerve-waf-edge}:/usr/local/bin/nerve-waf-edge:ro
      - ${NERVE_EXPERT_PACK_HOST:-../../dist/runtime/baseline}:/opt/nerve/native/baseline:ro
