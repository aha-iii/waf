{{- if .Values.controller.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nerve-waf.controller.fullname" . }}
  labels:
    {{- include "nerve-waf.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  type: {{ .Values.controller.service.type }}
  selector:
    {{- include "nerve-waf.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: controller
  ports:
    - name: http
      port: {{ .Values.controller.service.port }}
      targetPort: http
{{- end }}
