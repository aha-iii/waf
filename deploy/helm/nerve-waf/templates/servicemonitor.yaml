{{- if .Values.metrics.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "nerve-waf.controller.fullname" . }}
  labels:
    {{- include "nerve-waf.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "nerve-waf.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: controller
  endpoints:
    - port: http
      path: /api/health
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      scheme: http
  # Note: full Prometheus metrics endpoint planned; this monitors control-plane availability.
{{- end }}
