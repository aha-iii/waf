apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nerve-waf.fullname" . }}
  labels:
    app.kubernetes.io/name: nerve-waf
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: nerve-waf
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nerve-waf
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          env:
            - name: PORT
              value: {{ .Values.service.port | quote }}
            - name: TZ
              value: {{ .Values.env.TZ | quote }}
            - name: DATABASE_URL
              value: {{ .Values.env.DATABASE_URL | quote }}
            - name: NERVE_URL
              value: {{ .Values.env.NERVE_URL | quote }}
            - name: NERVE_EXPERT_ENGINE
              value: {{ .Values.env.NERVE_EXPERT_ENGINE | quote }}
            - name: NERVE_EXPERT_PACK
              value: {{ .Values.env.NERVE_EXPERT_PACK | quote }}
            - name: NERVE_NATIVE_DEV_PACK
              value: {{ .Values.env.NERVE_NATIVE_DEV_PACK | quote }}
            - name: NERVE_AUTH_ENABLED
              value: {{ .Values.env.NERVE_AUTH_ENABLED | quote }}
            - name: WAF_ENABLE_LEGACY_TOPOLOGY
              value: {{ .Values.env.WAF_ENABLE_LEGACY_TOPOLOGY | quote }}
            - name: WAF_ENABLE_LEGACY_NP
              value: {{ .Values.env.WAF_ENABLE_LEGACY_NP | quote }}
            {{- if .Values.auth.enabled }}
            - name: NERVE_API_KEY
              {{- if .Values.auth.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret }}
                  key: {{ .Values.auth.existingSecretKey }}
              {{- else }}
              value: {{ .Values.auth.apiKey | quote }}
              {{- end }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.livenessPath }}
              port: http
            initialDelaySeconds: {{ .Values.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readinessPath }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: {{ .Values.probes.periodSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
