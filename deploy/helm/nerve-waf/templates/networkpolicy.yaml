{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "nerve-waf.fullname" . }}-controller
  labels:
    {{- include "nerve-waf.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "nerve-waf.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: controller
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: {{ .Values.controller.service.port }}
          protocol: TCP
  egress:
    - ports:
        - port: 5432
          protocol: TCP
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
{{- if .Values.agent.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "nerve-waf.fullname" . }}-agent
  labels:
    {{- include "nerve-waf.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "nerve-waf.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: agent
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: {{ .Values.agent.service.port }}
          protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "nerve-waf.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: controller
      ports:
        - port: {{ .Values.controller.service.port }}
          protocol: TCP
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
{{- end }}
{{- end }}
