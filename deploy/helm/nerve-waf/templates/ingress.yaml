{{- if and .Values.ingress.enabled .Values.controller.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "nerve-waf.fullname" . }}
  labels:
    {{- include "nerve-waf.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ if eq .service "agent" }}{{ include "nerve-waf.agent.fullname" $ }}{{ else }}{{ include "nerve-waf.controller.fullname" $ }}{{ end }}
                port:
                  number: {{ if eq .service "agent" }}{{ $.Values.agent.service.port }}{{ else }}{{ $.Values.controller.service.port }}{{ end }}
          {{- end }}
    {{- end }}
{{- end }}
