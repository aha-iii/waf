# Nerve WAF Helm values (defaults for Kubernetes).
# Override via -f my-values.yaml; never commit production secrets.
# Structure follows Cilium-style component blocks: controller / agent / ingress.

global:
  imageRegistry: ""
  imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/YOUR-ORG/nerve-waf
  tag: ""          # defaults to Chart.appVersion when empty
  pullPolicy: IfNotPresent

database:
  url: "postgres://postgres:CHANGE_ME@postgres:5432/nerve"

auth:
  enabled: true
  apiKey: ""
  existingSecret: ""
  existingSecretKey: NERVE_API_KEY

controller:
  enabled: true
  replicaCount: 2
  service:
    type: ClusterIP
    port: 9000
  env:
    TZ: "Asia/Shanghai"
    NERVE_EXPERT_ENGINE: "off"
    NERVE_NATIVE_DEV_PACK: "0"
    WAF_ENABLE_LEGACY_TOPOLOGY: "0"
    WAF_ENABLE_LEGACY_NP: "0"
    NERVE_AUTH_ENABLED: "1"
    RUST_LOG: "info"
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      memory: 1Gi
  probes:
    livenessPath: /api/health
    readinessPath: /api/health
    initialDelaySeconds: 10
    periodSeconds: 10
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

agent:
  enabled: true
  # deployment: centralized L7 pool; daemonset: one Agent per node
  mode: deployment
  replicaCount: 1
  service:
    type: ClusterIP
    port: 9080
  daemonSet:
    nodeSelector: {}
    tolerations: []
  env:
    TZ: "Asia/Shanghai"
    NERVE_EXPERT_ENGINE: "off"
    WAF_AGENT_SYNC_MODE: "watch"
    RUST_LOG: "info"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  probes:
    livenessPath: /health
    readinessPath: /health
    initialDelaySeconds: 15
    periodSeconds: 10

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: nerve-waf.example.com
      paths:
        - path: /
          pathType: Prefix
          service: controller
  tls: []

# Optional node Agent (eBPF) URL — not the L7 nerve-waf-agent
nerveNodeAgent:
  url: ""

networkPolicy:
  enabled: false

metrics:
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}
    # requires Prometheus Operator CRD
