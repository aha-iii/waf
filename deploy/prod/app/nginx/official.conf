# 官网静态；Console 跳转到 waf 子域；/api/ 仍同域反代（预约演示留资）
# APISIX：Host www.* / 根域 → nerve-official:80

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 32m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/x-javascript image/svg+xml;

    # Console 统一入口：waf 子域
    location = /console {
        return 308 https://waf.ahatec.com.cn/console/;
    }

    location /console/ {
        return 308 https://waf.ahatec.com.cn$request_uri;
    }

    # 官网预约演示等公开 API：保持 www 同域，避免跨域 308
    location /api/ {
        proxy_pass http://nerve-waf-api:8781/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
