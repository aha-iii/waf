# Nerve 公网 TLS 终结（宿主机映射 80/443）
#
# Client → nerve-tls → nerve-ddos-edge:8780 → nerve-waf-edge → apisix:9080 → 业务
# 证书：./certs/{www,waf,alert,git,ddos}.ahatec.com.cn.{pem,key}

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 256m;
    server_tokens off;

    # Docker 内 DNS；upstream 使用 resolve，避免 ddos-edge 重建后 TLS 仍指向旧 IP（502）
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream nerve_ddos {
        zone nerve_ddos 64k;
        server nerve-ddos-edge:8780 resolve;
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name www.ahatec.com.cn ahatec.com.cn;
        ssl_certificate     /etc/nginx/certs/www.ahatec.com.cn.pem;
        ssl_certificate_key /etc/nginx/certs/www.ahatec.com.cn.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        location / {
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_connect_timeout 5s;
            proxy_send_timeout    300s;
            proxy_read_timeout    300s;
            proxy_pass http://nerve_ddos;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name waf.ahatec.com.cn www.waf.ahatec.com.cn;
        ssl_certificate     /etc/nginx/certs/waf.ahatec.com.cn.pem;
        ssl_certificate_key /etc/nginx/certs/waf.ahatec.com.cn.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        location / {
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_connect_timeout 5s;
            proxy_send_timeout    300s;
            proxy_read_timeout    300s;
            proxy_pass http://nerve_ddos;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name alert.ahatec.com.cn www.alert.ahatec.com.cn;
        ssl_certificate     /etc/nginx/certs/alert.ahatec.com.cn.pem;
        ssl_certificate_key /etc/nginx/certs/alert.ahatec.com.cn.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        location / {
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_connect_timeout 5s;
            proxy_send_timeout    300s;
            proxy_read_timeout    300s;
            proxy_pass http://nerve_ddos;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name git.ahatec.com.cn www.git.ahatec.com.cn;
        ssl_certificate     /etc/nginx/certs/git.ahatec.com.cn.pem;
        ssl_certificate_key /etc/nginx/certs/git.ahatec.com.cn.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        client_max_body_size 256m;
        location / {
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_connect_timeout 5s;
            proxy_send_timeout    300s;
            proxy_read_timeout    300s;
            proxy_pass http://nerve_ddos;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name ddos.ahatec.com.cn www.ddos.ahatec.com.cn;
        ssl_certificate     /etc/nginx/certs/ddos.ahatec.com.cn.pem;
        ssl_certificate_key /etc/nginx/certs/ddos.ahatec.com.cn.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        location / {
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_connect_timeout 5s;
            proxy_send_timeout    300s;
            proxy_read_timeout    300s;
            proxy_pass http://nerve_ddos;
        }
    }
}
