#
# APISIX — Nerve prod（etcd 配置中心）
# 挂载：/usr/local/apisix/conf/config.yaml
#
# admin_key 须与 infra/.env 的 APISIX_ADMIN_KEY 一致（改密时两边同步）

apisix:
  node_listen: 9080
  enable_admin: true
  enable_control: true
  control:
    ip: 0.0.0.0
    port: 9090
  ssl:
    enable: true
    listen:
      - port: 9443

deployment:
  role: traditional
  role_traditional:
    config_provider: etcd
  admin:
    allow_admin:
      - 0.0.0.0/0
    admin_key:
      - name: admin
        key: edd1c9f034335f136f87ad84b625c8f1
        role: admin
  etcd:
    host:
      - "http://etcd:2379"
    prefix: "/apisix"
    timeout: 30

# 大静态资源（Console JS ~1.3MB）避免落盘缓冲；gzip 压缩出口带宽
# client_max_body_size：GitLab GraphQL / 推送 / 工件上传；过小会 413（OpenResty）
nginx_config:
  http:
    client_max_body_size: 256m
    gzip: "on"
    gzip_vary: "on"
    gzip_min_length: 1024
    gzip_comp_level: 5
    gzip_types: "text/plain text/css application/json application/javascript text/xml application/xml text/javascript application/x-javascript image/svg+xml"
    proxy_buffer_size: 128k
    proxy_buffers: "32 128k"
    proxy_busy_buffers_size: 256k
    proxy_max_temp_file_size: 0

plugin_attr:
  prometheus:
    export_addr:
      ip: 0.0.0.0
      port: 9091
