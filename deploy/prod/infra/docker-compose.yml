# Nerve prod infra — 一次部署：Postgres / Redis / etcd / APISIX
#
#   cp .env.example .env
#   docker compose up -d
#   bash scripts/apply-apisix-routes.sh
#
# 业务栈见 ../app/（join 本文件创建的 external network nerve-prod）

name: nerve-infra

services:
  postgres:
    image: postgres:16-alpine
    container_name: nerve-prod-postgres
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-nerve}
    volumes:
      - nerve-prod-pg:/var/lib/postgresql/data
    networks:
      - nerve-prod
    # 默认不映射宿主机；调试时取消下一行注释
    # ports:
    #   - "${POSTGRES_HOST_PORT:-127.0.0.1:5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: nerve-prod-redis
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - nerve-prod-redis:/data
    networks:
      - nerve-prod
    # ports:
    #   - "${REDIS_HOST_PORT:-127.0.0.1:6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  etcd:
    image: quay.io/coreos/etcd:v3.5.15
    container_name: nerve-prod-etcd
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      ETCDCTL_API: "3"
    command:
      - /usr/local/bin/etcd
      - --name=etcd0
      - --data-dir=/etcd-data
      - --advertise-client-urls=http://etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --initial-advertise-peer-urls=http://etcd:2380
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-cluster=etcd0=http://etcd:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=nerve-prod-etcd
    volumes:
      - nerve-prod-etcd:/etcd-data
    networks:
      - nerve-prod
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  apisix:
    image: apache/apisix:3.17.0-debian
    container_name: nerve-prod-apisix
    depends_on:
      etcd:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
    ports:
      - "${APISIX_HTTP_PORT:-80}:9080"
      # 大陆未备案机常拦 80/443；用 9080→9080 作临时公网入口
      - "${APISIX_HTTP_ALT_PORT:-9080}:9080"
      - "${APISIX_HTTPS_PORT:-443}:9443"
      # Admin / 内嵌 Dashboard（/ui/）；外网需安全组放行 9180，建议仅授权办公 IP
      - "${APISIX_ADMIN_PORT:-9180}:9180"
    networks:
      - nerve-prod
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9180/apisix/admin/routes -H \"X-API-KEY: edd1c9f034335f136f87ad84b625c8f1\" >/dev/null || curl -fsS -o /dev/null http://127.0.0.1:9080/"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s
    restart: unless-stopped

volumes:
  nerve-prod-pg:
  nerve-prod-redis:
  nerve-prod-etcd:

networks:
  nerve-prod:
    name: nerve-prod
    driver: bridge
