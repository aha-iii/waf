# Nerve prod infra — Postgres / Redis / etcd / APISIX / TLS 入口
#
# 目标链路：Client → nerve-tls(:443) → ddos → waf-edge → apisix:9080 → 业务

name: nerve-infra

services:
  postgres:
    image: postgres:16-alpine
    container_name: nerve-prod-postgres
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-nerve}
    volumes:
      - nerve-prod-pg:/var/lib/postgresql/data
    networks:
      - nerve-prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: nerve-prod-redis
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - nerve-prod-redis:/data
    networks:
      - nerve-prod
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  etcd:
    image: quay.io/coreos/etcd:v3.5.15
    container_name: nerve-prod-etcd
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      ETCDCTL_API: "3"
    command:
      - /usr/local/bin/etcd
      - --name=etcd0
      - --data-dir=/etcd-data
      - --advertise-client-urls=http://etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --initial-advertise-peer-urls=http://etcd:2380
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-cluster=etcd0=http://etcd:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=nerve-prod-etcd
    volumes:
      - nerve-prod-etcd:/etcd-data
    networks:
      - nerve-prod
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  apisix:
    image: apache/apisix:3.17.0-debian
    container_name: nerve-prod-apisix
    depends_on:
      etcd:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
    ports:
      - "${APISIX_ADMIN_PORT:-9180}:9180"
      - "${APISIX_HTTP_DEBUG_BIND:-127.0.0.1:9080}:9080"
    networks:
      - nerve-prod
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9180/apisix/admin/routes -H \"X-API-KEY: edd1c9f034335f136f87ad84b625c8f1\" >/dev/null || curl -fsS -o /dev/null http://127.0.0.1:9080/"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s
    restart: unless-stopped

  nerve-tls:
    image: nginx:1.27-alpine
    container_name: nerve-prod-tls
    depends_on:
      - apisix
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./tls/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "${TLS_HTTP_PORT:-80}:80"
      - "${TLS_HTTPS_PORT:-443}:443"
    networks:
      - nerve-prod
    healthcheck:
      test: ["CMD-SHELL", "nginx -t && wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  nerve-prod-pg:
  nerve-prod-redis:
  nerve-prod-etcd:

networks:
  nerve-prod:
    name: nerve-prod
    driver: bridge
