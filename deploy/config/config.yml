# Nerve WAF API — sample config mounted into the container at /etc/nerve-waf/config.yml.
# Change placeholders (especially database.url); DATABASE_URL env overrides this file.
# 示例配置：请将 database.url 改成你的 PostgreSQL；也可用环境变量 DATABASE_URL 覆盖。

waf:
  api:
    port: 9000
  data_dir: "/var/lib/nerve-waf/data"
  plugins_dir: "/opt/nerve-waf/plugins"
  nerve_url: "http://host.docker.internal:8766"
  database:
    url: "postgres://postgres:nerve_waf_dev@postgres:5432/nerve"
  console:
    port: 9090              # nerve-waf-console；Vite dev 常用 5177

logging:
  level: info
  access_log: "/var/lib/nerve-waf/logs/access.log"
  audit_log: "/var/lib/nerve-waf/logs/audit.log"
  error_log: "/var/lib/nerve-waf/logs/error.log"
  server_log: "/var/lib/nerve-waf/logs/server.log"
  format: json
  rotate: daily
  max_size_mb: 100
  max_age_days: 7
  max_backups: 14
