name: nerve-waf-ci

on:
  push:
    branches: [main, master, "develop/*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p nerve-waf-controller -p nerve-waf-agent -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: Swatinem/rust-cache@v2
      - name: Store unit tests
        run: cargo test -p nerve-waf-store --lib
      - name: Controller policy / incident / baseline tests
        run: cargo test -p nerve-waf-controller -- policy_sim incident baseline
      - name: Dataplane contract & parity tests
        run: cargo test -p nerve-waf-dataplane

  helm-lint:
    name: Helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v5
      - run: helm lint deploy/helm/nerve-waf

  hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 禁止内网地址与仓库外路径
        run: |
          fail=0
          if git grep -In -e "recloud\.com\.cn" -e "ahatec\.com\.cn" -- . ; then
            echo "::error::发现内网地址，锁文件请使用公共 registry"
            fail=1
          fi
          if git grep -In -e "file:\.\./\.\./\.\./\.\./Nerve-ui" \
               -e 'path = "\.\./\.\./\.\./\.\./' -- . ; then
            echo "::error::发现指向仓库外的依赖路径"
            fail=1
          fi
          exit $fail
      - name: 密钥文件不得被跟踪
        run: |
          if git ls-files | grep -E '^\.secrets/'; then
            echo "::error::.secrets/ 不应被跟踪"
            exit 1
          fi
